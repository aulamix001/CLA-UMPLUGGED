name: Windows x64
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and package Windows x64
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-package
          path: |
            dist/Unplugged-Study-Windows-x64.zip
            dist/Unplugged-Study-Windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            build/windows-x64/editor-preview.png
            build/windows-x64/Testing/Temporary/LastTest.log
            build/windows-x64/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-package
          path: dist
      - name: Check package integrity
        working-directory: dist
        run: sha256sum --check Unplugged-Study-Windows-x64.zip.sha256
      - name: Publish downloadable VST3 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/Unplugged-Study-Windows-x64.zip \
            dist/Unplugged-Study-Windows-x64.zip.sha256 \
            --verify-tag \
            --title "Unplugged Study $RELEASE_TAG - Windows x64" \
            --notes-file Docs/RELEASE_NOTES.md
